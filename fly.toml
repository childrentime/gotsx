# fly launch --copy-config --no-deploy && fly deploy   (one shared-cpu-1x instance is plenty: the demo is ~15 MB and idles at ~10 MB RSS)
app = "gotsx-shop"
primary_region = "sin"

[build]
  [build.args]
    APP = "shop"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
